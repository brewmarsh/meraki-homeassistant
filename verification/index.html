<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meraki Card Verification</title>
  <script type="module">
    // Mock Home Assistant elements
    class MockElement extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
      }
    }
    customElements.define('ha-card', class extends MockElement {});
    customElements.define('ha-textfield', class extends MockElement {});
    customElements.define('ha-entity-picker', class extends MockElement {});
    customElements.define('ha-icon', class extends MockElement {});
    customElements.define('ha-circular-progress', class extends MockElement {});
    customElements.define('ha-select', class extends MockElement {});
    customElements.define('ha-list-item', class extends MockElement {});
    customElements.define('ha-alert', class extends MockElement {});
    customElements.define('ha-button', class extends MockElement {});
    customElements.define('mwc-list-item', class extends MockElement {});

    import '../custom_components/meraki_ha/www/meraki-card.js';

    window.addEventListener('load', async () => {
      const card = document.createElement('meraki-network-vitals-card');
      const editor = await card.constructor.getConfigElement();

      editor.hass = {
        states: {
          'sensor.test': { state: 'online', attributes: {} }
        },
        callWS: async () => [],
        user: { name: 'Test User' }
      };
      editor.setConfig({
        type: 'custom:meraki-network-vitals-card',
        gateway_entity: 'sensor.gateway',
        name: 'Test Card'
      });

      document.body.appendChild(editor);
      console.log('Editor added to body');
    });
  </script>
</head>
<body>
</body>
</html>
