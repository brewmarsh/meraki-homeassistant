[project]
name = "meraki_ha"
version = "2.6.0"
dependencies = [
    "baml-py>=0.219.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "braintrust>=0.12.0",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=6.2.2",
    "pytest-cov>=2.10.1",
    "pytest-asyncio>=0.20.3",
    "pytest-homeassistant-custom-component>=0.2.1",
    "pytest-sugar>=0.9.4",
    "pytest-timeout>=1.4.2",
    "pytest-picked>=0.5.1",
    "pytest-socket>=0.6.0",
    "pytest-unordered>=0.5.2",
    "requests-mock>=1.8.0",
    "aiohttp>=3.11.11",
    "respx>=0.16.2",
    "syrupy>=3.0.6",
    "anyio>=4.14.1",
    "pytest-freezer>=0.4.9",
    "pyturbojpeg>=2.4.0",
    "cryptography>=43.0.1",
    "homeassistant==2024.12.5",
    "meraki==1.54.0",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "custom_components"
]
asyncio_mode = "auto"

[tool.mypy]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "aiofiles"
ignore_missing_imports = true

# Required for the AI-assisted "Gatekeeper" workflow.
[tool.ruff]
fix = true
unsafe-fixes = true
exclude = [".pyenv"]
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "D",  # pydocstyle
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["D100", "D104", "D107", "D211", "D212"]
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "D101", "D102", "D103", "D401"]
"scripts/*" = ["E501", "D101", "D102", "D103", "D401"]
"verify_all_imports.py" = ["D103"]


[tool.codespell]
skip = "*/dist/*"
