name: Release Pipeline

on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: 'Version & Release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install bump-my-version
        run: uv pip install --system bump-my-version

      - name: Determine Version Bump
        id: bump_part
        run: |
          # Use [major], [minor], [patch] from commit message if present
          # Default to patch for beta, minor for main if no tags
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
            echo "part=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
            echo "part=minor" >> $GITHUB_OUTPUT
          else
            echo "part=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump Version
        run: |
          uv run bump-my-version bump ${{ steps.bump_part.outputs.part }} --allow-dirty

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(release): version bump to v${{ steps.get_version.outputs.version }} [skip ci]'
          file_pattern: 'custom_components/meraki_ha/manifest.json package.json frontend/package.json .bumpversion.toml'

      - name: Get New Version
        id: get_version
        run: |
          VERSION=$(grep -Po '(?<="version": ")[^"]*' custom_components/meraki_ha/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: release-drafter/release-drafter@v7.7.0
        with:
          publish: true
          tag: v${{ steps.get_version.outputs.version }}
          prerelease: ${{ github.ref_name == 'beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
