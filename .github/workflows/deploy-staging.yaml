name: Deploy Beta to Staging (Smoke Test)

on:
  push:
    branches:
      - beta

jobs:
  deploy-to-staging:
    runs-on: [self-hosted, meraki-smoketest]

    env:
      DESTINATION_PATH: '/ha_config/custom_components/meraki_ha'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use the Node version your project expects

      - name: Build Custom Panel
        # IMPORTANT: Change this path to wherever your package.json lives!
        working-directory: ./
        run: |
          echo "Installing NPM dependencies..."
          npm ci
          
          echo "Building frontend..."
          npm run build

      - name: Copy files to Staging (rsync)
        shell: bash
        env:
          DEPLOY_PATH: ${{ env.DESTINATION_PATH }}
        run: |
          SourceComponentDir="${GITHUB_WORKSPACE}/custom_components/meraki_ha/"
          DestinationPath="${DEPLOY_PATH}"

          echo "Starting Staging Deployment..."
          echo "Source: ${SourceComponentDir}"
          echo "Destination: ${DestinationPath}"

          # Ensure destination exists
          sudo mkdir -p "${DestinationPath}"

          # Sync files
          sudo rsync -rltpD --inplace --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.log' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            "${SourceComponentDir}" "${DestinationPath}"

          echo "Deployment to Staging Complete."

      - name: Update Home Assistant Configuration
        shell: bash
        run: |
          echo "Updating configuration.yaml..."
          sudo tee /ha_config/configuration.yaml <<EOF
          default_config:

          logger:
            default: info
            logs:
              custom_components.meraki_ha: debug
          EOF
          # Ensure log file exists and is writable
          sudo touch /ha_config/home-assistant.log
          sudo chmod 666 /ha_config/home-assistant.log

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Install Python 3.13 first so 'uv' has a target
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Full Integration Reset (Delete > Restart > Add)
        shell: bash
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
        run: |
          echo "Running Reset Script in isolated environment..."
          # uv run --with creates an ephemeral environment just for this command, protecting the system python
          uv run --with aiohttp python3 tests/scripts/reset_integration.py
          
      - name: Audit Logs for Errors
        id: audit_logs
        shell: bash
        env:
          HASS_SERVER: ${{ secrets.HA_STAGING_URL }}
          HASS_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
        run: |
          echo "Scanning logs for Meraki errors via API..."
          CLEAN_SERVER=$(echo "${HASS_SERVER}" | sed 's:/*$::')

          # 1. Readiness Check
          echo "Waiting for API to be ready..."
          READY=false
          for i in {1..6}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${HASS_TOKEN}" "$CLEAN_SERVER/api/config")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              READY=true
              echo "API is ready."
              break
            fi
            echo "API returned $HTTP_STATUS. Waiting (Attempt $i/6)..."
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Home Assistant API did not become ready in time."
            exit 1
          fi

          # 2. Fetch logs
          echo "Fetching logs..."
          RESPONSE=$(curl -s -H "Authorization: Bearer ${HASS_TOKEN}" -w "\n%{http_code}" "$CLEAN_SERVER/api/error_log")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          LOG_CONTENT=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Warning: Log file API not available. Skipping log scan."
            exit 0
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::API failed with $HTTP_STATUS."
            exit 1
          fi

          # 3. Grep the content (Strictly meraki_ha errors only)
          if echo "$LOG_CONTENT" | grep -i "custom_components.meraki_ha" > meraki_errors.txt; then
            echo "::error::CRITICAL: Found Meraki errors in the log!"
            # Set an environment variable so the next step knows to fire
            echo "HAS_ERRORS=true" >> $GITHUB_ENV
          else
            echo "Logs are clean. Smoke test passed."
            echo "HAS_ERRORS=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Issue for Errors
        if: env.HAS_ERRORS == 'true'
        shell: bash
        env:
          # Use your PAT here to authorize the issue creation
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "Constructing issue payload..."
          # Format the errors into a Markdown code block
          ERRORS=$(cat meraki_errors.txt)
          BODY="The staging smoke test detected the following \`meraki_ha\` errors:\n\n\`\`\`text\n${ERRORS}\n\`\`\`"
          
          jq -n \
            --arg title "🚨 Staging Smoke Test Failed: Meraki Errors Detected" \
            --arg body "$BODY" \
            '{title: $title, body: $body, labels: ["bug", "staging", "automated-report"]}' > issue_payload.json

          echo "Submitting issue to GitHub API..."
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/${REPO}/issues" \
               -d @issue_payload.json > /dev/null

          echo "Issue created successfully. Failing the workflow..."
          exit 1
