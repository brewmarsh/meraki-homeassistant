name: Deploy beta to staging (smoke test)

on:
  push:
    branches:
      - beta

jobs:
  deploy-to-staging:
    runs-on: [self-hosted, meraki-smoketest]

    env:
      # Use the runner container's internal volume mount name
      HA_CONFIG_DIR: '/ha_config'
      DESTINATION_PATH: '/ha_config/custom_components/meraki_ha'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build custom panel
        working-directory: ./custom_components/meraki_ha/www
        run: |
          echo "Installing NPM dependencies..."
          npm ci
          
          echo "Building frontend..."
          npm run build

      - name: Copy files to staging (rsync)
        shell: bash
        env:
          DEPLOY_PATH: ${{ env.DESTINATION_PATH }}
        run: |
          SourceComponentDir="${GITHUB_WORKSPACE}/custom_components/meraki_ha/"
          DestinationPath="${DEPLOY_PATH}"

          echo "Starting staging deployment..."
          echo "Source: ${SourceComponentDir}"
          echo "Destination: ${DestinationPath}"

          sudo mkdir -p "${DestinationPath}"

          # Sync files
          # Sync files (Restored --inplace to fix Docker bind mount temp file errors)
          sudo rsync -rcvltpD --inplace --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.log' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            "${SourceComponentDir}" "${DestinationPath}"

          echo "Deployment to staging complete."

      - name: Update Home Assistant configuration
        shell: bash
        run: |
          echo "Updating configuration.yaml..."
          sudo tee ${{ env.HA_CONFIG_DIR }}/configuration.yaml <<EOF
          default_config:

          logger:
            default: info
            logs:
              custom_components.meraki_ha: debug
          EOF
          # Ensure log file exists and is writable
          sudo touch ${{ env.HA_CONFIG_DIR }}/home-assistant.log
          sudo chmod 666 ${{ env.HA_CONFIG_DIR }}/home-assistant.log

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Full integration reset (delete > restart > add)
        shell: bash
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
        run: |
          echo "Running Reset Script in isolated environment..."
          uv run --with aiohttp python3 tests/scripts/reset_integration.py

      - name: Audit logs for errors
        id: audit_logs
        shell: bash
        run: |
          echo "Initiating 90s discovery wait cycle..."
          sleep 90

          echo "Extracting logs from local Home Assistant config directory..."
          cat "$HA_CONFIG_DIR/home-assistant.log" > full_ha_log.txt || { echo "Failed to read local log file"; exit 1; }

          # Multi-Stage Audit
          # Stage 1: Search for string literal Traceback (most recent call last):
          grep -A 30 "Traceback (most recent call last):" full_ha_log.txt > meraki_errors.txt || true

          # Stage 2: Search for AttributeError, NameError, or TypeError specifically within the custom_components/meraki_ha namespace
          # Stage 3: If any match is found, pipe the entire traceback (use grep -A 30) into meraki_errors.txt
          grep -E "AttributeError|NameError|TypeError" full_ha_log.txt | grep "custom_components/meraki_ha" | while read -r line; do
            grep -A 30 "$line" full_ha_log.txt >> meraki_errors.txt || true
          done

          # Fail Condition: The step must exit with code 1 only if meraki_errors.txt has a file size greater than 0
          if [ -s meraki_errors.txt ]; then
            echo "::error::CRITICAL: Meraki errors detected in Home Assistant logs!"
            cat meraki_errors.txt
            exit 1
          else
            echo "Logs are clean. Self-healing audit passed."
          fi
