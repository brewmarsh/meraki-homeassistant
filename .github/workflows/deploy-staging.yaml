name: Deploy beta to staging (smoke test)

on:
  push:
    branches:
      - beta

jobs:
  deploy-to-staging:
    runs-on: [self-hosted, meraki-smoketest]

    env:
      # Use the runner container's internal volume mount name
      HA_CONFIG_DIR: '/ha_config'
      DESTINATION_PATH: '/ha_config/custom_components/meraki_ha'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build custom panel
        working-directory: ./custom_components/meraki_ha/www
        run: |
          echo "Installing NPM dependencies..."
          npm ci
          
          echo "Building frontend..."
          npm run build

      - name: Copy files to staging (rsync)
        shell: bash
        env:
          DEPLOY_PATH: ${{ env.DESTINATION_PATH }}
        run: |
          SourceComponentDir="${GITHUB_WORKSPACE}/custom_components/meraki_ha/"
          DestinationPath="${DEPLOY_PATH}"

          echo "Starting staging deployment..."
          echo "Source: ${SourceComponentDir}"
          echo "Destination: ${DestinationPath}"

          sudo mkdir -p "${DestinationPath}"

          # Sync files
          # Sync files (Restored --inplace to fix Docker bind mount temp file errors)
          sudo rsync -rcvltpD --inplace --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.log' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            "${SourceComponentDir}" "${DestinationPath}"

          echo "Deployment to staging complete."

      - name: Update Home Assistant configuration
        shell: bash
        run: |
          echo "Updating configuration.yaml..."
          sudo tee ${{ env.HA_CONFIG_DIR }}/configuration.yaml <<EOF
          default_config:

          logger:
            default: info
            logs:
              custom_components.meraki_ha: debug
          EOF
          # Ensure log file exists and is writable
          sudo touch ${{ env.HA_CONFIG_DIR }}/home-assistant.log
          sudo chmod 666 ${{ env.HA_CONFIG_DIR }}/home-assistant.log

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Full integration reset (delete > restart > add)
        shell: bash
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
        run: |
          echo "Running Reset Script in isolated environment..."
          uv run --with aiohttp python3 tests/scripts/reset_integration.py

      - name: Wait for initial Meraki data fetch
        run: |
          echo "Waiting 90 seconds for coordinators to fetch cloud data..."
          sleep 90

      - name: Audit logs for errors
        id: audit_logs
        shell: bash
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
        run: |
          echo "Pulling error logs directly via Home Assistant API..."
          
          # Fetch the log directly from the API, bypassing file system completely
          # Retry loop for curl (3 attempts, 5s delay)
          SUCCESS=0
          for i in {1..3}; do
            if curl -s -f -H "Authorization: Bearer $HA_TOKEN" \
                 -H "Content-Type: application/json" \
                 "$HA_URL/api/error_log" > full_ha_log.txt; then
              SUCCESS=1
              break
            fi
            echo "Attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Error: Failed to fetch logs from Home Assistant API after 3 attempts."
            exit 1
          fi
          
          # Check if the API returned an unauthorized/error payload instead of a text log
          if grep -q "401: Unauthorized" full_ha_log.txt; then
            echo "Error: Failed to authenticate with Home Assistant API."
            exit 1
          fi

          # Search for Meraki-specific errors using expanded regex
          # Ensure meraki_errors.txt is only considered "found" if size > 0
          if grep -B 2 -A 25 -E -i "(error|exception|traceback|attributeerror|nameerror).*meraki_ha" full_ha_log.txt > meraki_errors.txt && [ -s meraki_errors.txt ]; then
            echo "::error::CRITICAL: Found Meraki errors in the log!"
            echo "HAS_ERRORS=true" >> $GITHUB_ENV
          else
            echo "Logs are clean. Smoke test passed."
            echo "HAS_ERRORS=false" >> $GITHUB_ENV
          fi
