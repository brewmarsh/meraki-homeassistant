name: Deploy Beta to Staging (Smoke Test)

on:
  push:
    branches:
      - beta

jobs:
  deploy-to-staging:
    runs-on: [self-hosted, meraki-smoketest]

    env:
      DESTINATION_PATH: '/ha_config/custom_components/meraki_ha'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to Staging (rsync)
        shell: bash
        env:
          DEPLOY_PATH: ${{ env.DESTINATION_PATH }}
        run: |
          SourceComponentDir="${GITHUB_WORKSPACE}/custom_components/meraki_ha/"
          DestinationPath="${DEPLOY_PATH}"

          echo "Starting Staging Deployment..."
          echo "Source: ${SourceComponentDir}"
          echo "Destination: ${DestinationPath}"

          # Ensure destination exists
          sudo mkdir -p "${DestinationPath}"

          # Sync files
          sudo rsync -rltpD --inplace --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.log' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            "${SourceComponentDir}" "${DestinationPath}"

          echo "Deployment to Staging Complete."

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # FIX 1: Install Python 3.13 first so 'uv --system' has a target
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Full Integration Reset (Delete > Restart > Add)
        shell: bash
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
        run: |
          echo "Installing dependencies..."
          uv pip install --system aiohttp > /dev/null

          echo "Force reinstalling aiodns and pycares..."
          uv pip uninstall --system pycares aiodns
          uv pip install --system --no-cache-dir pycares==4.11.0 aiodns==3.6.1

          echo "Running Reset Script..."
          # Pass secrets implicitly via env vars defined above
          python3 tests/scripts/reset_integration.py

      - name: Audit Logs for Errors
        shell: bash
        env:
          HASS_SERVER: ${{ secrets.HA_STAGING_URL }}
          HASS_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
        run: |
          echo "Scanning logs for Meraki errors via API..."

          # 1. Normalize HASS_SERVER (remove trailing slash)
          CLEAN_SERVER=$(echo "${HASS_SERVER}" | sed 's:/*$::')

          # 2. Retry loop (Wait up to 60s for API to be ready)
          for i in {1..6}; do
            echo "Fetching logs (Attempt $i/6)..."
            LOG_CONTENT=$(curl -s -f -H "Authorization: Bearer ${HASS_TOKEN}" "$CLEAN_SERVER/api/error_log")
            if [ $? -eq 0 ]; then
              break
            fi

            if [ $i -eq 6 ]; then
              echo "::error::API timeout or persistent failure after 60s."
              # Diagnostic check for 401/404
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${HASS_TOKEN}" "$CLEAN_SERVER/api/error_log")
              echo "Home Assistant API returned status: $HTTP_STATUS"
              if [ "$HTTP_STATUS" -ne 200 ]; then
                 echo "::error::Received $HTTP_STATUS from API. Check token permissions and URL."
              fi
              exit 1
            fi
            sleep 10
          done

          # 3. Grep the content
          if echo "$LOG_CONTENT" | grep -i "custom_components.meraki_ha"; then
            echo "::error::CRITICAL: Found Meraki errors in the log!"
            # Print the specific error lines for debugging
            echo "$LOG_CONTENT" | grep -i "custom_components.meraki_ha"
            exit 1
          else
            echo "Logs are clean. Smoke test passed."
          fi
