name: Deploy beta to staging (smoke test)

on:
  push:
    branches:
      - beta

jobs:
  deploy-to-staging:
    runs-on: [self-hosted, meraki-smoketest]

    env:
      DESTINATION_PATH: '/config/custom_components/meraki_ha'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use the Node version your project expects

      - name: Build custom panel
        # IMPORTANT: Change this path to wherever your package.json lives!
        working-directory: ./custom_components/meraki_ha/www
        run: |
          echo "Installing NPM dependencies..."
          npm ci
          
          echo "Building frontend..."
          npm run build

      - name: Copy files to staging (rsync)
        shell: bash
        env:
          DEPLOY_PATH: ${{ env.DESTINATION_PATH }}
        run: |
          SourceComponentDir="${GITHUB_WORKSPACE}/custom_components/meraki_ha/"
          DestinationPath="${DEPLOY_PATH}"

          echo "Starting staging deployment..."
          echo "Source: ${SourceComponentDir}"
          echo "Destination: ${DestinationPath}"

          # Ensure destination exists
          sudo mkdir -p "${DestinationPath}"

          # Sync files
          sudo rsync -rltpD --inplace --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.log' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            "${SourceComponentDir}" "${DestinationPath}"

          echo "Deployment to staging complete."

      - name: Update Home Assistant configuration
        shell: bash
        run: |
          echo "Updating configuration.yaml..."
          sudo tee /config/configuration.yaml <<EOF
          default_config:

          logger:
            default: info
            logs:
              custom_components.meraki_ha: debug
          EOF
          # Ensure log file exists and is writable
          sudo touch /config/home-assistant.log
          sudo chmod 666 /config/home-assistant.log

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Install Python 3.13 first so 'uv' has a target
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Full integration reset (delete > restart > add)
        shell: bash
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
        run: |
          echo "Running Reset Script in isolated environment..."
          # uv run --with creates an ephemeral environment just for this command, protecting the system python
          uv run --with aiohttp python3 tests/scripts/reset_integration.py

      - name: Wait for initial Meraki data fetch
        run: |
          echo "Waiting 45 seconds for coordinators to fetch cloud data..."
          sleep 45

      - name: Audit logs for errors
        id: audit_logs
        shell: bash
        run: |
          echo "Scanning local log file for Meraki errors..."
          
          # Since we are on a self-hosted runner, we can just read the physical file
          if [ ! -f "/config/home-assistant.log" ]; then
            echo "Warning: /config/home-assistant.log not found. Skipping log scan."
            exit 0
          fi

          # Grep the content (Strictly meraki_ha errors only)
          if grep -i "custom_components.meraki_ha" /config/home-assistant.log > meraki_errors.txt; then
            echo "::error::CRITICAL: Found Meraki errors in the log!"
            echo "HAS_ERRORS=true" >> $GITHUB_ENV
          else
            echo "Logs are clean. Smoke test passed."
            echo "HAS_ERRORS=false" >> $GITHUB_ENV
          fi
          
      - name: Create GitHub issue for errors
        if: env.HAS_ERRORS == 'true'
        shell: bash
        env:
          # Use your PAT here to authorize the issue creation
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "Constructing issue payload..."
          # Format the errors into a Markdown code block
          ERRORS=$(cat meraki_errors.txt)
          BODY="The staging smoke test detected the following \`meraki_ha\` errors:\n\n\`\`\`text\n${ERRORS}\n\`\`\`"
          
          jq -n \
            --arg title "🚨 Staging smoke test failed: Meraki errors detected" \
            --arg body "$BODY" \
            '{title: $title, body: $body, labels: ["bug", "staging", "automated-report"]}' > issue_payload.json

          echo "Submitting issue to GitHub API..."
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/${REPO}/issues" \
               -d @issue_payload.json > /dev/null

          echo "Issue created successfully. Failing the workflow..."
          exit 1
