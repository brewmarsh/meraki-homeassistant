name: Deploy Beta to Staging (Smoke Test)

on:
  push:
    branches:
      - beta

jobs:
  deploy-to-staging:
    runs-on: [self-hosted, meraki-smoketest]

    env:
      DESTINATION_PATH: '/ha_config/custom_components/meraki_ha'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to Staging (rsync)
        shell: bash
        env:
          DEPLOY_PATH: ${{ env.DESTINATION_PATH }}
        run: |
          SourceComponentDir="${GITHUB_WORKSPACE}/custom_components/meraki_ha/"
          DestinationPath="${DEPLOY_PATH}"

          echo "Starting Staging Deployment..."
          echo "Source: ${SourceComponentDir}"
          echo "Destination: ${DestinationPath}"

          # Ensure destination exists
          sudo mkdir -p "${DestinationPath}"

          # Sync files
          sudo rsync -rltpD --inplace --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.log' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            "${SourceComponentDir}" "${DestinationPath}"

          echo "Deployment to Staging Complete."

      - name: Update Home Assistant Configuration
        shell: bash
        run: |
          echo "Updating configuration.yaml..."
          sudo tee /ha_config/configuration.yaml <<EOF
          default_config:

          logger:
            default: info
            logs:
              custom_components.meraki_ha: debug
          EOF
          # Ensure log file exists and is writable
          sudo touch /ha_config/home-assistant.log
          sudo chmod 666 /ha_config/home-assistant.log

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # FIX 1: Install Python 3.13 first so 'uv --system' has a target
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Full Integration Reset (Delete > Restart > Add)
        shell: bash
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
        run: |
          echo "Installing dependencies..."
          uv pip install --system aiohttp > /dev/null

          echo "Force reinstalling aiodns and pycares..."
          uv pip uninstall --system pycares aiodns
          uv pip install --system --no-cache-dir pycares==4.11.0 aiodns==3.6.1

          echo "Running Reset Script..."
          # Pass secrets implicitly via env vars defined above
          python3 tests/scripts/reset_integration.py

      - name: Audit Logs for Errors
        shell: bash
        env:
          HASS_SERVER: ${{ secrets.HA_STAGING_URL }}
          HASS_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
        run: |
          echo "Scanning logs for Meraki errors via API..."
          CLEAN_SERVER=$(echo "${HASS_SERVER}" | sed 's:/*$::')

          # 1. Readiness Check (Wait up to 60s for API to be ready)
          echo "Waiting for API to be ready..."
          READY=false
          for i in {1..6}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${HASS_TOKEN}" "$CLEAN_SERVER/api/config")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              READY=true
              echo "API is ready."
              break
            fi
            echo "API returned $HTTP_STATUS. Waiting (Attempt $i/6)..."
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Home Assistant API did not become ready in time."
            exit 1
          fi

          # 2. Fetch logs
          echo "Fetching logs..."
          RESPONSE=$(curl -s -H "Authorization: Bearer ${HASS_TOKEN}" -w "\n%{http_code}" "$CLEAN_SERVER/api/error_log")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          LOG_CONTENT=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Warning: Log file API not available. Skipping log scan."
            exit 0
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::API failed with $HTTP_STATUS."
            exit 1
          fi

          # 3. Grep the content
          if echo "$LOG_CONTENT" | grep -i "custom_components.meraki_ha"; then
            echo "::error::CRITICAL: Found Meraki errors in the log!"
            # Print the specific error lines for debugging
            echo "$LOG_CONTENT" | grep -i "custom_components.meraki_ha"
            exit 1
          else
            echo "Logs are clean. Smoke test passed."
          fi
