name: Deploy beta to staging (smoke test)

on:
  push:
    branches:
      - beta

jobs:
  deploy-to-staging:
    runs-on: [self-hosted, meraki-smoketest]

    env:
      # Job-Level Environment Variables (Available to ALL steps)
      HA_CONFIG_DIR: '/ha_config'
      DESTINATION_PATH: '/ha_config/custom_components/meraki_ha'
      HA_URL: ${{ secrets.HA_STAGING_URL }}
      HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
      MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
      MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      # NOTE: Node.js setup and React build steps were removed to support the React Teardown

      - name: Copy files to staging (rsync)
        shell: bash
        env:
          DEPLOY_PATH: ${{ env.DESTINATION_PATH }}
        run: |
          SourceComponentDir="${GITHUB_WORKSPACE}/custom_components/meraki_ha/"
          DestinationPath="${DEPLOY_PATH}"

          echo "Starting staging deployment..."
          echo "Source: ${SourceComponentDir}"
          echo "Destination: ${DestinationPath}"

          sudo mkdir -p "${DestinationPath}"

          # Sync files (Restored --inplace to fix Docker bind mount temp file errors)
          sudo rsync -rcvltpD --inplace --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.log' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            "${SourceComponentDir}" "${DestinationPath}"

          echo "Deployment to staging complete."

      - name: Update Home Assistant configuration
        shell: bash
        run: |
          echo "Updating configuration.yaml..."
          sudo tee ${{ env.HA_CONFIG_DIR }}/configuration.yaml <<EOF
          default_config:

          logger:
            default: info
            logs:
              custom_components.meraki_ha: debug
          EOF
          # Ensure log file exists and is writable
          sudo touch ${{ env.HA_CONFIG_DIR }}/home-assistant.log
          sudo chmod 666 ${{ env.HA_CONFIG_DIR }}/home-assistant.log

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Full integration reset (delete > restart > add)
        shell: bash
        run: |
          echo "Running Reset Script in isolated environment..."
          uv run --with aiohttp python3 tests/scripts/reset_integration.py

      - name: Audit Home Assistant Logs
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          echo "Initiating 90s discovery wait cycle..."
          sleep 90
          
          echo "Extracting logs from Home Assistant API..."
          curl -sS -H "Authorization: Bearer ${{ env.HA_TOKEN }}" -H "Content-Type: application/json" "${{ env.HA_URL }}/api/error_log" > full_ha_log.txt || { echo "Failed to fetch logs from API"; exit 1; }
          
          # Multi-Stage Audit
          # Stage 1: Search for string literal Traceback (most recent call last):
          grep -A 30 "Traceback (most recent call last
