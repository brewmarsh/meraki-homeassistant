name: Staging Tests

on:
  push:
    branches:
      - beta
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '**.webp'
      - 'AGENTS.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-to-staging:
    runs-on: [self-hosted, meraki-smoketest]
    permissions:
      contents: read
      issues: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HA_CONFIG_DIR: '/ha_config'
      DESTINATION_PATH: '/ha_config/custom_components/meraki_ha'
      HA_URL: ${{ secrets.HA_STAGING_URL }}
      HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
      MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
      MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Check Runner Dependencies
        run: |
          set -e
          if ! command -v docker &> /dev/null; then
            echo "::error::Docker is not installed on this runner. HACS validation requires Docker. Please install Docker on the self-hosted runner."
            exit 1
          fi
          if ! command -v node &> /dev/null; then
            echo "::error::Node.js is not installed on this runner. Frontend build requires Node.js."
            exit 1
          fi
          if ! command -v python3 &> /dev/null; then
            echo "::error::Python 3 is not installed on this runner. Backend tests require Python 3."
            exit 1
          fi
          echo "All runner dependencies (Docker, Node.js, Python 3) are present."

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Strict Type Check & Linting
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          if ! (npx tsc --noEmit && npx eslint src/ --ext .ts) 2>&1 | tee frontend_lint_output.txt; then
            echo "FAILED_STEP_NAME=Frontend Strict Type Check & Linting" >> $GITHUB_ENV
            {
              echo "CI_ERROR_DETAILS<<EOF"
              tail -n 20 frontend_lint_output.txt
              echo "EOF"
            } >> $GITHUB_ENV
            exit 1
          fi

      - name: Bump version for cache-busting
        working-directory: frontend
        shell: bash
        run: |
          npm version prerelease --preid=beta.${{ github.run_number }} --no-git-tag-version
          echo "Stamped frontend with beta run number: ${{ github.run_number }}"

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build_output.txt; then
            echo "FAILED_STEP_NAME=Build frontend" >> $GITHUB_ENV
            {
              echo "CI_ERROR_DETAILS<<EOF"
              tail -n 20 build_output.txt
              echo "EOF"
            } >> $GITHUB_ENV
            exit 1
          fi

      - name: Verify build artifacts
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f "custom_components/meraki_ha/www/meraki-card.js" ]; then
            echo "::error::Build artifact meraki-card.js missing!"
            echo "FAILED_STEP_NAME=Verify build artifacts" >> $GITHUB_ENV
            echo "CI_ERROR_DETAILS=The Vite build failed to output meraki-card.js" >> $GITHUB_ENV
            exit 1
          fi
          echo "Build artifact verified: meraki-card.js"

      - name: Copy files to staging (rsync)
        shell: bash
        env:
          DEPLOY_PATH: ${{ env.DESTINATION_PATH }}
        run: |
          set -o pipefail
          SourceComponentDir="${GITHUB_WORKSPACE}/custom_components/meraki_ha/"
          DestinationPath="${DEPLOY_PATH}"
          SourceBlueprintsDir="${SourceComponentDir}blueprints/"
          DestinationBlueprintsPath="${{ env.HA_CONFIG_DIR }}/blueprints/"

          sudo mkdir -p "${DestinationPath}"
          sudo mkdir -p "${DestinationBlueprintsPath}"

          if ! sudo rsync -rcvltpD --inplace --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '*.log' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            "${SourceComponentDir}" "${DestinationPath}" 2>&1 | tee rsync_output.txt; then
            echo "FAILED_STEP_NAME=Copy files to staging (rsync)" >> $GITHUB_ENV
            {
              echo "CI_ERROR_DETAILS<<EOF"
              tail -n 20 rsync_output.txt
              echo "EOF"
            } >> $GITHUB_ENV
            exit 1
          fi

          sudo rsync -rcvltpD --inplace "${SourceBlueprintsDir}" "${DestinationBlueprintsPath}"

      - name: Update Home Assistant configuration
        shell: bash
        run: |
          set -o pipefail
          sudo tee ${{ env.HA_CONFIG_DIR }}/configuration.yaml <<EOF
          default_config:
          system_log:
            max_entries: 500
          logger:
            default: info
            logs:
              custom_components.meraki_ha: debug
          EOF

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Generate BAML Client
        shell: bash
        run: |
          set -o pipefail
          uv run baml-cli generate

      - name: Run Pytest with Coverage Gate
        shell: bash
        run: |
          set -o pipefail
          if ! uv run --with pytest-homeassistant-custom-component --with pytest-cov --with PyTurboJPEG --with "meraki==1.54.0" pytest tests/ \
            --cov=custom_components/meraki_ha \
            --cov-report=term-missing \
            --cov-fail-under=75 2>&1 | tee pytest_output.txt; then
            echo "FAILED_STEP_NAME=Run Pytest with Coverage Gate" >> $GITHUB_ENV
            {
              echo "CI_ERROR_DETAILS<<EOF"
              tail -n 20 pytest_output.txt
              echo "EOF"
            } >> $GITHUB_ENV
            exit 1
          fi

      - name: Pre-boot Configuration Check
        shell: bash
        run: |
          set -o pipefail
          # Use the configuration.yaml written in the previous step
          # We need to make sure 'homeassistant' package is available
          if ! uv run --with homeassistant hass --script check_config -c ${{ env.HA_CONFIG_DIR }} 2>&1 | tee config_check_output.txt; then
            echo "FAILED_STEP_NAME=Pre-boot Configuration Check" >> $GITHUB_ENV
            {
              echo "CI_ERROR_DETAILS<<EOF"
              tail -n 20 config_check_output.txt
              echo "EOF"
            } >> $GITHUB_ENV
            exit 1
          fi

      - name: Full integration reset (delete > restart > add)
        shell: bash
        run: |
          set -o pipefail
          if ! uv run --with aiohttp python3 scripts/reset_integration.py 2>&1 | tee reset_output.txt; then
            echo "FAILED_STEP_NAME=Full integration reset (Staging)" >> $GITHUB_ENV
            {
              echo "CI_ERROR_DETAILS<<EOF"
              tail -n 20 reset_output.txt
              echo "EOF"
            } >> $GITHUB_ENV
            exit 1
          fi

      - name: Audit logs for errors
        id: audit_logs
        shell: bash
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}
          HA_CONFIG_DIR: ${{ env.HA_CONFIG_DIR }}
        run: |
          set -o pipefail
          sleep 90

          echo "Fetching logs for audit..."
          cat << 'EOF' > fetch_logs.py
          import asyncio
          import aiohttp
          import os
          import re
          import sys
          from pathlib import Path

          # IGNORE_REGEX defines the list of regexes for log lines that should be ignored during CI/CD auditing.
          IGNORE_REGEX = [
              re.compile(r"homeassistant\.helpers\.entity_registry is logging too frequently", re.I),
              re.compile(r"Network traffic analysis is not enabled for network", re.I),
              re.compile(r"Vlan tracking is not enabled for network", re.I),
              re.compile(r"Appliance port tracking is not enabled", re.I),
              re.compile(r"Meraki API Informational Error.*Status 400", re.I),
          ]

          async def fetch_via_websocket():
              url = os.environ.get("HA_URL", "").replace("http://", "ws://").replace("https://", "wss://") + "/api/websocket"
              token = os.environ.get("HA_TOKEN", "")
              try:
                  async with aiohttp.ClientSession() as session:
                      async with session.ws_connect(url) as ws:
                          await ws.receive_json() # auth_required
                          await ws.send_json({"type": "auth", "access_token": token})
                          auth_ok = await ws.receive_json()
                          if auth_ok.get("type") != "auth_ok":
                              print(f"WebSocket Auth Failed: {auth_ok}")
                              return None

                          # Query the system_log component
                          await ws.send_json({"id": 1, "type": "system_log/list"})
                          response = await ws.receive_json()

                          if not response.get("success"):
                              print("Failed to fetch system logs")
                              return None

                          logs = response.get("result", [])
                          logs_text = ""
                          for e in logs:
                              log_entry = f"[{e.get('level')}] {e.get('source')}\n{e.get('message')}\n"
                              if e.get("exception"):
                                  log_entry += f"{e.get('exception')}\n"
                              log_entry += "-" * 40 + "\n"
                              logs_text += log_entry
                          return logs_text
              except Exception as e:
                  print(f"WebSocket connection error: {e}")
                  return None

          async def main():
              ha_config_dir = os.environ.get("HA_CONFIG_DIR", "/ha_config")
              log_path = Path(ha_config_dir) / "home-assistant.log"

              logs_content = ""
              source = "Filesystem"

              if log_path.exists():
                  print(f"Reading logs from {log_path}...")
                  try:
                      # Read with sudo if needed via shell, but here we try direct read first
                      # If direct read fails, we might need to handle it.
                      logs_content = log_path.read_text(errors="replace")
                  except Exception as e:
                      print(f"Failed to read log file directly: {e}. Trying via sudo...")
                      import subprocess
                      try:
                          logs_content = subprocess.check_output(["sudo", "cat", str(log_path)], text=True, errors="replace")
                      except Exception as sudo_e:
                          print(f"Failed to read via sudo: {sudo_e}")
                          source = "WebSocket fallback"
              else:
                  print(f"Log file {log_path} not found. Falling back to WebSocket...")
                  source = "WebSocket"

              if not logs_content:
                  logs_content = await fetch_via_websocket()
                  if not logs_content:
                      print("Failed to fetch logs from both filesystem and WebSocket.")
                      sys.exit(1)
                  source = "WebSocket"

              with open("full_ha_log.txt", "w") as full_log:
                  full_log.write(logs_content)

              # Audit for Meraki errors
              errors = []
              # We look for "meraki" and common error/warning indicators
              # HA logs typically look like: 2024-03-14 12:00:00 ERROR (MainThread) [source] message
              for line in logs_content.splitlines():
                  line_upper = line.upper()
                  is_issue_level = any(level in line_upper for level in ("ERROR", "CRITICAL", "WARNING"))

                  if not is_issue_level:
                      continue

                  # Check against IGNORE_REGEX first to skip acceptable warnings regardless of "meraki" keyword
                  if any(pattern.search(line) for pattern in IGNORE_REGEX):
                      continue

                  # Only fail on Meraki-related issues
                  if "meraki" in line.lower():
                      # Exclude common false positives if any
                      if "Received unknown command: config/config_entries/get" in line:
                          # We actually WANT to catch this as an error now that we know about it
                          pass
                      errors.append(line)

              if errors:
                  with open("meraki_errors.txt", "w") as f:
                      for e in errors:
                          f.write(e + "\n")
                  print(f"Found {len(errors)} Meraki errors in {source} logs.")
                  print("=" * 60)
                  print("=== ERROR DETAILS ===")
                  for e in errors:
                      print(e)
                      print("-" * 40)
                  print("=" * 60)
              else:
                  print(f"No Meraki errors found in the {source} logs.")

          if __name__ == "__main__":
              asyncio.run(main())
          EOF

          # Execute the Python script
          if ! uv run --with aiohttp python3 fetch_logs.py; then
            echo "FAILED_STEP_NAME=Audit logs for errors" >> "$GITHUB_ENV"
            echo "CI_ERROR_DETAILS=Failed to execute log fetch/audit script." >> "$GITHUB_ENV"
            exit 1
          fi

          if [ -s meraki_errors.txt ]; then
            echo "FAILED_STEP_NAME=Audit logs for errors" >> "$GITHUB_ENV"
            echo "=== LOG AUDIT FAILURE: UNEXPECTED MERAKI ERRORS FOUND ==="
            cat meraki_errors.txt
            echo "========================================================="
            {
              echo "CI_ERROR_DETAILS<<EOF"
              cat meraki_errors.txt
              echo "EOF"
            } >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Upload Full HA Log Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: home-assistant-debug-logs
          path: full_ha_log.txt
          retention-days: 3

      - name: Audit Entity States
        shell: bash
        run: |
          set -o pipefail
          PAYLOAD='{"template": "{{ integration_entities(\"meraki_ha\") | select(\"is_state\", [\"unavailable\", \"unknown\"]) | list }}"}'
          if ! RESPONSE=$(curl -sfS -X POST -H "Authorization: Bearer ${{ secrets.HA_STAGING_TOKEN }}" -H "Content-Type: application/json" -d "$PAYLOAD" "${{ secrets.HA_STAGING_URL }}/api/template"); then
            echo "FAILED_STEP_NAME=Audit Entity States" >> "$GITHUB_ENV"
            echo "CI_ERROR_DETAILS=Failed to query HA API" >> "$GITHUB_ENV"
            exit 1
          fi

          if [ "$RESPONSE" != "[]" ] && [ "$RESPONSE" != "" ]; then
            echo "FAILED_STEP_NAME=Audit Entity States" >> "$GITHUB_ENV"
            { echo "CI_ERROR_DETAILS<<EOF"; echo "$RESPONSE"; echo "EOF"; } >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Install Node.js dependencies (Root)
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright UI Tests
        shell: bash
        run: |
          set -o pipefail
          if ! npx playwright test 2>&1 | tee playwright_output.txt; then
            echo "FAILED_STEP_NAME=Run Playwright UI Tests" >> $GITHUB_ENV
            {
              echo "CI_ERROR_DETAILS<<EOF"
              tail -n 20 playwright_output.txt
              echo "EOF"
            } >> $GITHUB_ENV
            exit 1
          fi
        env:
          BASE_URL: ${{ secrets.HA_STAGING_URL }}
          HA_TOKEN: ${{ secrets.HA_STAGING_TOKEN }}

      - name: Capture HA Logs on Failure
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE=""
          if [ -f "full_ha_log.txt" ]; then
            LOG_FILE="full_ha_log.txt"
          elif [ -f "${{ env.HA_CONFIG_DIR }}/home-assistant.log" ]; then
            sudo cp "${{ env.HA_CONFIG_DIR }}/home-assistant.log" ./full_ha_log_failure.txt
            LOG_FILE="./full_ha_log_failure.txt"
          fi

          if [ -n "$LOG_FILE" ]; then
            {
              echo "ERROR_LOGS<<EOF"
              echo "--- Last 50 lines of $LOG_FILE ---"
              tail -n 50 "$LOG_FILE"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const script = require('./scripts/generate_failure_issue.js');
              await script({github, context});
            } catch (e) {
              console.error('Failed to run centralized issue script:', e);
              const title = '🚨 Staging Tests Failed';
              const failedStep = process.env.FAILED_STEP_NAME || 'Unknown Step';
              const errorDetails = process.env.CI_ERROR_DETAILS || 'No details captured.';
              const body = `### ❌ Failed Step: \`${failedStep}\`\n\n### 📋 Error Details\n\`\`\`text\n${errorDetails}\n\`\`\`\n\n[🔗 View full failing run details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'automated-ci', 'jules']
              });
            }
