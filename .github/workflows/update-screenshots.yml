name: 'docs: Update UI Screenshots'

on:
  workflow_dispatch:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'

jobs:
  update-screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Screenshots
        env:
          HA_URL: ${{ secrets.HA_STAGING_URL }}
          HA_USERNAME: ${{ secrets.HA_STAGING_USERNAME }}
          HA_PASSWORD: ${{ secrets.HA_STAGING_PASSWORD }}
        run: python scripts/generate_docs_screenshots.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update UI screenshots'
          title: 'docs: Automated UI Screenshot Updates'
          body: |
            This PR contains updated documentation screenshots generated automatically by the Playwright CI workflow.

            **Details:**
            - **Source:** Staging Environment
            - **Trigger:** ${{ github.event_name }}
            - **Run ID:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          branch: 'docs/auto-update-screenshots'
          delete-branch: true
          labels: |
            documentation
            automated-pr
