name: Validate with hassfest
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '**.webp'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '**.webp'
      - 'AGENTS.md'
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 'Hassfest'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Run Hassfest'
        id: hassfest
        uses: 'home-assistant/actions/hassfest@master'
        continue-on-error: true

      - name: 'Handle Hassfest Failure'
        if: steps.hassfest.outcome == 'failure'
        run: |
          echo "FAILED_STEP_NAME=Hassfest Validation" >> $GITHUB_ENV
          echo "CI_ERROR_DETAILS=Hassfest validation failed. Check the Action logs for specific integration manifest or configuration errors." >> $GITHUB_ENV
          exit 1

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const script = require('./scripts/generate_failure_issue.js');
              await script({github, context});
            } catch (e) {
              const title = '🚨 Hassfest Validation Failed';
              const failedStep = process.env.FAILED_STEP_NAME || 'Unknown Step';
              const errorDetails = process.env.CI_ERROR_DETAILS || 'No details captured.';
              const body = `### ❌ Failed Step: \`${failedStep}\`\n\n### 📋 Error Details\n\`\`\`text\n${errorDetails}\n\`\`\`\n\n[🔗 Run Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'automated-ci', 'jules']
              });
            }
