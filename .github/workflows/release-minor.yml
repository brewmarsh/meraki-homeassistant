# ==============================================================================
# RELEASE PREPARATION WORKFLOW (Minor Version)
# ==============================================================================
# This workflow prepares a new minor release by:
# 1. Incrementing the version in manifest.json (e.g., 2.4.5 -> 2.5.0).
# 2. Updating the CHANGELOG.md with a placeholder entry.
# 3. Opening a Pull Request from beta into main.
#
# INSTRUCTIONS FOR DEVELOPER:
# 1. Review and merge the generated Pull Request.
# 2. Once merged, manually create a Git Tag and GitHub Release from the UI
#    (or use the 'gh release create' command locally).
# ==============================================================================

name: Release Minor Version

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (process version but do not create PR)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare Minor Release
    # Restrict execution to the beta branch
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Minor Version in Manifest
        id: versioning
        run: |
          MANIFEST="custom_components/meraki_ha/manifest.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::manifest.json not found at $MANIFEST"
            exit 1
          fi

          # Extract current version
          CURRENT_VERSION=$(jq -r '.version' "$MANIFEST")
          echo "Detected current version: $CURRENT_VERSION"

          # Increment minor version (e.g., 2.4.x -> 2.5.0)
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEW_VERSION="${major}.$((minor + 1)).0"

          echo "Target version: $NEW_VERSION"

          # Update manifest.json
          jq ".version = \"$NEW_VERSION\"" "$MANIFEST" > tmp.json && mv tmp.json "$MANIFEST"

          # Store for later steps
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update Changelog
        run: |
          DATE=$(date +'%Y-%m-%d')
          ENTRY="## [${{ env.NEW_VERSION }}] - ${DATE}\n\n### Minor Release\n- Promoted changes from beta branch.\n- Full details available in the GitHub Release notes.\n"

          if [ -f "CHANGELOG.md" ]; then
            # Prepend to existing file
            echo -e "${ENTRY}\n$(cat CHANGELOG.md)" > CHANGELOG.md
          else
            # Create new file
            echo -e "# Changelog\n\n${ENTRY}" > CHANGELOG.md
          fi

      - name: Create Release Pull Request
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): bump version to ${{ env.NEW_VERSION }}'
          committer: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          title: 'chore(release): Release v${{ env.NEW_VERSION }}'
          body: |
            ## 🚀 Automated Release Preparation

            This PR was automatically generated to prepare for the **v${{ env.NEW_VERSION }}** minor release.

            ### 📝 Changes included:
            - Updated `manifest.json` version to `${{ env.NEW_VERSION }}`.
            - Added placeholder entry in `CHANGELOG.md`.

            ### 🛠 Next Steps:
            1. **Review** the changes in this PR.
            2. **Merge** this PR into `main`.
            3. **Create a Tag and Release** (v${{ env.NEW_VERSION }}) on GitHub once merged.

            *Generated by GitHub Actions.*
          branch: 'release/v${{ env.NEW_VERSION }}'
          base: 'main'
          labels: 'release, automated-pr'
          delete-branch: true
