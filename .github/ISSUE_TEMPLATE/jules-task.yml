name: 🤖 Ask Jules (AI Agent)
description: Trigger Jules to build, refactor, or fix code.
title: "[Jules]: "
labels: ["jules-agent"]
body:
  - type: markdown
    attributes:
      value: |
        When this issue is created, Jules will automatically analyze the requirements based on the `ROADMAP.md` and the `beta` branch.
        
        *Note: Jules is globally instructed to ignore errors outside `meraki_ha` and follow Home Assistant Sentence Case standards.*
  - type: textarea
    id: prompt
    attributes:
      label: Agent Prompt
      description: Describe exactly what you want Jules to build or refactor. 
      placeholder: |
        e.g., Implement Requirement [E-1] from the Roadmap.
        
        (You can also drop in specific code snippets, extra constraints, or error logs right here...)
    validations:
      required: true
